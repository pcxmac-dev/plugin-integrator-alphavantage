[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-alphavantage"
version = "0.3.1"  # the plugin's own release (CHANGELOG.md; on release/0.2.0 with Liminal's release); the app shows it on the Plugins view
description = "Alpha Vantage for Liminal: daily bars of stocks listed in London, Toronto, TSX Venture, Xetra, BSE, Shanghai and Shenzhen on a free key, the latest 100 days a request."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the class contract with the API cards, plugin API 2.2: liminal-libs 1.49.0); which app
# releases can load it is the plugin API the plugin declares (PLUGIN.api, checked when the app loads it), not this line
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
alphavantage = "plugin_integrator_alphavantage"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
